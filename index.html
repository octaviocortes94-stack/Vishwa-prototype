<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vishwa</title>


<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #f7f4ef;

    color: #3d3935;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 20px;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor {

    width: 100%;

    max-width: 600px;

    text-align: center;

}


/* =========================================================
   LOGO
========================================================= */

.logo {

    font-size: 42px;

    letter-spacing: 7px;

    margin-bottom: 35px;

}


/* =========================================================
   SELECCIÓN DE IDIOMA
========================================================= */

.idiomas {

    display: flex;

    justify-content: center;

    gap: 15px;

}

.boton-idioma {

    border: 1px solid #b8b0a6;

    background: transparent;

    padding: 12px 25px;

    font-family: inherit;

    font-size: 16px;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease;

}

.boton-idioma:hover {

    background: #3d3935;

    color: white;

}


/* =========================================================
   EXPERIENCIA
========================================================= */

.experiencia {

    display: none;

    width: 100%;

}


/* =========================================================
   IMAGEN DE VISHWA
========================================================= */

.ilustracion {

    width: 100%;

    margin-bottom: 20px;

}

.ilustracion img {

    width: 70%;

    max-width: 270px;

    height: auto;

}


/* =========================================================
   ZONA DEL MENSAJE
========================================================= */

.zona-mensaje {

    min-height: 190px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}


/* =========================================================
   RITUAL
========================================================= */

.instrucciones {

    display: flex;

    flex-direction: column;

    gap: 8px;

    font-size: 22px;

    letter-spacing: 2px;

    transition:
        opacity 1s ease;

}

.palabra {

    opacity: 0;

    transform:
        translateY(8px);

}

.palabra.visible {

    animation:
        aparecer 0.8s ease forwards;

}


/* =========================================================
   REFLEXIÓN
========================================================= */

.reflexion {

    display: none;

    width: 100%;

    max-width: 550px;

    font-size: 27px;

    line-height: 1.55;

    opacity: 0;

}

.reflexion.visible {

    display: block;

    animation:
        aparecer 1.5s ease forwards;

}


/* =========================================================
   BOTÓN NUEVO VISHWA
========================================================= */

.boton-nuevo {

    display: none;

    margin-top: 30px;

    border: 1px solid #3d3935;

    background: transparent;

    padding: 13px 28px;

    font-family: inherit;

    font-size: 16px;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease;

}

.boton-nuevo:hover {

    background: #3d3935;

    color: white;

}


/* =========================================================
   ANIMACIÓN
========================================================= */

@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 600px) {

    body {

        padding:
            25px 18px;

    }

    .logo {

        font-size: 34px;

        letter-spacing:
            6px;

    }

    .ilustracion img {

        max-width:
            220px;

    }

    .instrucciones {

        font-size:
            20px;

    }

    .reflexion {

        font-size:
            23px;

        line-height:
            1.5;

    }

}

</style>

</head>


<body>


<div class="contenedor">


    <!-- =====================================================
         LOGO
         OCULTO HASTA ELEGIR IDIOMA
    ====================================================== -->

    <div
        class="logo"
        id="logo"
        style="display: none;"
    >
        Vishwa
    </div>


    <!-- =====================================================
         SELECCIÓN DE IDIOMA
    ====================================================== -->

    <div
        class="idiomas"
        id="selectorIdioma"
    >

        <button
            class="boton-idioma"
            onclick="seleccionarIdioma('es')"
        >
            Español
        </button>


        <button
            class="boton-idioma"
            onclick="seleccionarIdioma('en')"
        >
            English
        </button>

    </div>


    <!-- =====================================================
         EXPERIENCIA VISHWA
    ====================================================== -->

    <div
        class="experiencia"
        id="experiencia"
    >


        <!-- IMAGEN -->

        <div class="ilustracion">

            <img
                src="vishwa-ilustracion.png"
                alt="Vishwa"
            >

        </div>


        <!-- =================================================
             ZONA CENTRAL

             PRIMERO:
             Respira / Exhala / Lee / Escribe

             DESPUÉS:
             Reflexión

             SIEMPRE EN EL MISMO ESPACIO
        ================================================== -->

        <div class="zona-mensaje">


            <!-- RITUAL -->

            <div
                class="instrucciones"
                id="instrucciones"
            ></div>


            <!-- REFLEXIÓN -->

            <div
                class="reflexion"
                id="reflexion"
            ></div>


            <!-- BOTÓN -->

            <button
                class="boton-nuevo"
                id="botonNuevo"
                onclick="nuevaReflexion()"
            ></button>


        </div>


    </div>


</div>



<script>

"Escuchar el deseo que aparece cuando dejo de compararme.",

"Permitirme imaginar una vida que todavía no existe.",

"Reconocer lo que me hace sentir verdaderamente vivo.",

"Elegir desde el deseo y no solamente desde la obligación.",

"Reconocer dónde termino yo y comienza el otro.",

"Decir que no sin convertirlo en una explicación interminable.",

"Dejar de abandonarme para evitar incomodar a alguien.",

"Preguntarme qué estoy aceptando por miedo a perder.",

"Proteger mi paz sin necesitar justificarla.",

"Distinguir entre ayudar y cargar.",

"Reconocer cuándo estoy dando más de lo que puedo sostener.",

"Permitir que alguien se decepcione sin sentir que he fallado.",

"Elegirme también cuando nadie me está eligiendo.",

"Poner un límite antes de necesitar alejarme.",

"Decir lo que siento antes de convertirlo en distancia.",

"Preguntarme qué estoy esperando de alguien sin decirlo.",

"Reconocer a quienes me hacen sentir en casa.",

"Agradecer una presencia que quizá he dado por sentada.",

"Aceptar que algunas personas llegan para quedarse y otras para enseñarme.",

"Escuchar para comprender y no solamente para responder.",

"Dejar de perseguir una conexión que necesita ser forzada.",

"Preguntarme qué versión de mí aparece cuando estoy con alguien.",

"Permitir que el cariño también tenga silencio.",

"Elegir vínculos donde pueda ser quien soy.",

"Reconocer que ya no soy quien necesitaba ser antes.",

"Dejar de pedirle al pasado que se comporte como presente.",

"Permitir que una etapa termine sin convertirla en fracaso.",

"Aceptar que crecer también puede incomodar.",

"Dejar que la vida me sorprenda fuera de mis planes.",

"Reconocer cuándo estoy intentando permanecer donde ya cambié.",

"Confiar un poco más en quien estoy llegando a ser.",

"Dar la bienvenida a lo que todavía no sé nombrar.",

"Preguntarme qué merece realmente mi energía.",

"Distinguir entre avanzar y simplemente estar ocupado.",

"Elegir aquello que quiero construir aunque tome tiempo.",

"Preguntarme qué quiero recordar de esta etapa de mi vida.",

"Reconocer qué actividades me acercan a quien quiero ser.",

"Dejar de medir mi camino con la vida de alguien más.",

"Construir algo que tenga sentido incluso cuando nadie lo vea.",

"Preguntarme qué estoy haciendo con el tiempo que tengo.",

"Elegir una dirección aunque todavía no conozca el destino.",

"Vivir de una manera que pueda reconocer como mía."

];


/* =========================================================
   100 REFLEXIONES EN INGLÉS
========================================================= */

const reflexionesEN = [

"Return to the moment that is happening.",

"Observe what is here without needing to change it.",

"Let go, for a moment, of what has not happened yet.",

"Listen to the silence between one thought and the next.",

"Allow this moment to be enough.",

"Look around and notice something you had overlooked.",

"Let the present take up all the space.",

"Breathe without rushing toward the next moment.",

"Feel where you are before deciding where to go.",

"Stay here a little longer.",

"Name what you are feeling without judging it.",

"Allow an emotion to exist without needing to solve it.",

"Ask what your feelings are trying to tell you.",

"Acknowledge what you have been avoiding feeling.",

"Distinguish between what you feel and what you think you should feel.",

"Make room for what feels heavy today.",

"Accept that feeling is also a way of understanding.",

"Observe your emotion before turning it into a decision.",

"Ask what the feeling needs from you.",

"Let the emotion move through you without becoming you.",

"Listen to what your body has been trying to tell you.",

"Notice where tension lives today.",

"Release what you have been holding for too long.",

"Feel your breath before listening to your thoughts.",

"Ask what your body needs in this moment.",

"Stop asking your body for what it cannot yet give.",

"Notice your tiredness without turning it into guilt.",

"Be in your body before returning to your routine.",

"Thank your body for all it carries in silence.",

"Listen before demanding.",

"Let go of what has ended, even if it still hurts.",

"Release the need to have an answer.",

"Stop carrying a story that no longer belongs to you.",

"Accept that some things do not need to be repaired.",

"Release the space occupied by what you no longer want.",

"Stop returning to places where you no longer are.",

"Allow a version of yourself to remain in the past.",

"Let go of what you hold only out of habit.",

"Accept that saying goodbye can also be a way of loving.",

"Make room for what you do not know yet.",

"Look at what you fear without making it bigger.",

"Ask what lies beneath your fear.",

"Distinguish between danger and possibility.",

"Accept that uncertainty is also part of the path.",

"Take a step while fear is still there.",

"Stop imagining endings that have not happened.",

"Notice how much of your fear belongs to the past.",

"Ask what you would do if you did not need to feel ready.",

"Let fear accompany you without letting it decide.",

"Remember that feeling afraid does not mean you are wrong.",

"Ask what you want when no one is watching.",

"Acknowledge what you desire without explaining it.",

"Distinguish between what you want and what you learned to want.",

"Give a name to what you are not yet ready to ask for.",

"Ask what you would choose without needing approval.",

"Allow yourself to want something different.",

"Listen to the desire that appears when comparison fades.",

"Allow yourself to imagine a life that does not exist yet.",

"Recognize what makes you feel truly alive.",

"Choose from desire, not only from obligation.",

"Recognize where you end and another person begins.",

"Say no without turning it into an endless explanation.",

"Stop abandoning yourself to avoid making someone uncomfortable.",

"Ask what you are accepting because you are afraid to lose it.",

"Protect your peace without needing to justify it.",

"Distinguish between helping and carrying.",

"Notice when you are giving more than you can sustain.",

"Allow someone to be disappointed without feeling that you have failed.",

"Choose yourself even when no one else is choosing you.",

"Set a boundary before you need to walk away.",

"Say what you feel before turning it into distance.",

"Ask what you are expecting from someone without saying it.",

"Recognize the people who make you feel at home.",

"Appreciate a presence you may have taken for granted.",

"Accept that some people come to stay and others come to teach.",

"Listen to understand, not only to respond.",

"Stop chasing a connection that needs to be forced.",

"Ask which version of yourself appears around someone.",

"Allow affection to have silence too.",

"Choose relationships where you can be yourself.",

"Accept that change can also feel like loss.",

"Recognize that you are no longer who you once needed to be.",

"Stop asking the past to behave like the present.",

"Allow a chapter to end without calling it failure.",

"Ask which part of you needs to change with you.",

"Accept that growth can feel uncomfortable.",

"Let life surprise you beyond your plans.",

"Notice when you are trying to remain somewhere you have already outgrown.",

"Trust a little more in who you are becoming.",

"Welcome what you do not know how to name yet.",

"Ask what truly deserves your energy.",

"Distinguish between moving forward and simply staying busy.",

"Choose what you want to build, even if it takes time.",

"Ask what you want to remember about this season of your life.",

"Recognize what brings you closer to who you want to become.",

"Stop measuring your path against someone else’s life.",

"Build something that matters even when no one sees it.",

"Ask what you are doing with the time you have.",

"Choose a direction even when you do not know the destination.",

"Live in a way that feels like your own."

];


/* =========================================================
   VARIABLES
========================================================= */

let idiomaActual = null;

let ultimaReflexion = -1;


/* =========================================================
   SELECCIONAR IDIOMA
========================================================= */

function seleccionarIdioma(idioma) {

    idiomaActual = idioma;

    localStorage.setItem(
        "vishwaIdioma",
        idioma
    );


    document.getElementById(
        "selectorIdioma"
    ).style.display = "none";


    document.getElementById(
        "logo"
    ).style.display = "block";


    document.getElementById(
        "experiencia"
    ).style.display = "block";


    iniciarRitual();

}


/* =========================================================
   RITUAL
========================================================= */

function iniciarRitual() {

    const instrucciones =
        document.getElementById(
            "instrucciones"
        );

    const reflexion =
        document.getElementById(
            "reflexion"
        );

    const boton =
        document.getElementById(
            "botonNuevo"
        );


    /* LIMPIAR */

    instrucciones.innerHTML = "";

    instrucciones.style.display =
        "flex";

    instrucciones.style.opacity =
        "1";


    reflexion.style.display =
        "none";

    reflexion.classList.remove(
        "visible"
    );


    boton.style.display =
        "none";


    /* =====================================================
       PALABRAS
    ===================================================== */

    const palabrasES = [

        "Respira.",
        "Exhala.",
        "Lee.",
        "Escribe."

    ];


    const palabrasEN = [

        "Breathe.",
        "Exhale.",
        "Read.",
        "Write."

    ];


    const palabras =
        idiomaActual === "en"
        ? palabrasEN
        : palabrasES;


    /*
       TIEMPOS:

       Respira  → 0 segundos
       Exhala   → 4 segundos
       Lee      → 8 segundos
       Escribe  → 9 segundos

       Por lo tanto:

       RESPIRA = 4 segundos

       EXHALA = 4 segundos

       LEE = 1 segundo

       ESCRIBE
    */

    const tiempos = [

        0,
        4000,
        8000,
        9000

    ];


    palabras.forEach(
        (palabra, index) => {

            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "palabra";


            elemento.textContent =
                palabra;


            instrucciones.appendChild(
                elemento
            );


            setTimeout(
                () => {

                    elemento.classList.add(
                        "visible"
                    );

                },
                tiempos[index]
            );

        }
    );


    /*
    DESPUÉS DE "ESCRIBE"

    Dejamos un segundo de pausa.
    */

    setTimeout(
        () => {

            instrucciones.style.opacity =
                "0";

        },
        10000
    );


    /*
    EL RITUAL DESAPARECE.

    LA REFLEXIÓN APARECE
    EN EL MISMO ESPACIO.
    */

    setTimeout(
        () => {

            instrucciones.innerHTML = "";

            instrucciones.style.display =
                "none";

            mostrarReflexion();

        },
        11000
    );

}


/* =========================================================
   MOSTRAR REFLEXIÓN
========================================================= */

function mostrarReflexion() {

    const reflexiones =
        idiomaActual === "en"
        ? reflexionesEN
        : reflexionesES;


    if (
        !reflexiones ||
        reflexiones.length === 0
    ) {

        return;

    }


    let indice;


    /*
    Evitar mostrar inmediatamente
    la misma reflexión.
    */

    do {

        indice =
            Math.floor(
                Math.random()
                *
                reflexiones.length
            );

    } while (

        indice === ultimaReflexion
        &&
        reflexiones.length > 1

    );


    ultimaReflexion =
        indice;


    const reflexion =
        document.getElementById(
            "reflexion"
        );


    const boton =
        document.getElementById(
            "botonNuevo"
        );


    /*
    Reiniciar animación
    */

    reflexion.classList.remove(
        "visible"
    );

    reflexion.style.display =
        "none";


    void reflexion.offsetWidth;


    /*
    Mostrar reflexión
    */

    reflexion.textContent =
        reflexiones[indice];


    reflexion.style.display =
        "block";


    reflexion.classList.add(
        "visible"
    );


    /*
    BOTÓN SEGÚN IDIOMA
    */

    boton.textContent =
        idiomaActual === "en"
        ? "New Vishwa"
        : "Nuevo Vishwa";


    boton.style.display =
        "inline-block";

}


/* =========================================================
   NUEVO VISHWA
========================================================= */

function nuevaReflexion() {

    /*
    IMPORTANTE:

    NO se ejecuta iniciarRitual().

    Por lo tanto:

    Nuevo Vishwa
    ↓
    nueva reflexión

    y nada más.
    */

    mostrarReflexion();

}


/* =========================================================
   AL ABRIR LA PÁGINA
========================================================= */

window.onload = function() {

    const idiomaGuardado =
        localStorage.getItem(
            "vishwaIdioma"
        );


    /*
    Si ya había elegido idioma:

    NO volvemos a preguntar.

    Vishwa aparece directamente
    y comienza una nueva sesión
    con el ritual.
    */

    if (

        idiomaGuardado === "es"
        ||
        idiomaGuardado === "en"

    ) {

        idiomaActual =
            idiomaGuardado;


        document.getElementById(
            "selectorIdioma"
        ).style.display =
            "none";


        document.getElementById(
            "logo"
        ).style.display =
            "block";


        document.getElementById(
            "experiencia"
        ).style.display =
            "block";


        iniciarRitual();

    }

};

</script>

</body>

</html>
