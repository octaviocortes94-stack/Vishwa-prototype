<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishwa</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f7f4ef;
    color: #3d3935;
    font-family: Georgia, "Times New Roman", serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 20px;
}

.contenedor {
    width: 100%;
    max-width: 620px;
    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* LOGO */

.logo {
    font-size: 42px;
    letter-spacing: 7px;
    margin-bottom: 40px;
}

/* IDIOMAS */

.idiomas {
    display: flex;
    gap: 15px;
    justify-content: center;
}

.boton-idioma {
    border: 1px solid #b8b0a6;
    background: transparent;

    padding: 12px 25px;

    font-family: inherit;
    font-size: 16px;

    cursor: pointer;

    transition: all 0.3s ease;
}

.boton-idioma:hover {
    background: #3d3935;
    color: white;
}

/* EXPERIENCIA */

.experiencia {
    display: none;
    width: 100%;
}

/* INSTRUCCIONES */

.instrucciones {
    min-height: 190px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 8px;

    font-size: 22px;
    letter-spacing: 2px;

    transition: opacity 1s ease;
}

.palabra {
    opacity: 0;
    transform: translateY(8px);
}

.palabra.visible {
    animation: aparecer 0.8s ease forwards;
}

/* ILUSTRACIÓN */

.ilustracion {
    width: 100%;
    margin: 15px 0 25px;
}

.ilustracion img {
    max-width: 260px;
    width: 70%;
    height: auto;
}

/* REFLEXIÓN */

.reflexion {
    display: none;

    margin: 20px auto 35px;

    max-width: 550px;

    font-size: 27px;
    line-height: 1.55;

    opacity: 0;
}

.reflexion.visible {
    display: block;
    animation: aparecer 1.5s ease forwards;
}

/* BOTÓN */

.boton-nuevo {
    display: none;

    border: 1px solid #3d3935;
    background: transparent;

    padding: 13px 28px;

    font-family: inherit;
    font-size: 16px;

    cursor: pointer;

    transition: all 0.3s ease;
}

.boton-nuevo:hover {
    background: #3d3935;
    color: white;
}

/* ANIMACIÓN */

@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* CELULAR */

@media (max-width: 600px) {

    body {
        padding: 25px 18px;
    }

    .logo {
        font-size: 34px;
        letter-spacing: 6px;
    }

    .instrucciones {
        font-size: 20px;
        min-height: 180px;
    }

    .reflexion {
        font-size: 23px;
        line-height: 1.5;
    }

    .ilustracion img {
        max-width: 220px;
    }

}

</style>
</head>


<body>

<div class="contenedor">

    <div class="logo">
        Vishwa
    </div>


    <!-- SELECCIÓN DE IDIOMA -->

    <div
        class="idiomas"
        id="selectorIdioma"
    >

        <button
            class="boton-idioma"
            onclick="seleccionarIdioma('es')"
        >
            Español
        </button>

        <button
            class="boton-idioma"
            onclick="seleccionarIdioma('en')"
        >
            English
        </button>

    </div>


    <!-- EXPERIENCIA -->

    <div
        class="experiencia"
        id="experiencia"
    >

        <!-- RITUAL DE ENTRADA -->

        <div
            class="instrucciones"
            id="instrucciones"
        ></div>


        <!-- ILUSTRACIÓN -->

        <div class="ilustracion">

            <img
                src="vishwa-ilustracion.png"
                alt="Vishwa"
            >

        </div>


        <!-- REFLEXIÓN -->

        <div
            class="reflexion"
            id="reflexion"
        ></div>


        <!-- NUEVO VISHWA -->

        <button
            class="boton-nuevo"
            id="botonNuevo"
            onclick="nuevaReflexion()"
        >
        </button>

    </div>

</div>


<script>

/* =========================================================
   REFLEXIONES TEMPORALES
   DESPUÉS LAS SACAREMOS A UN ARCHIVO INDEPENDIENTE
========================================================= */

const reflexionesES = [

"Volver al momento que está ocurriendo.",
"Observar lo que existe sin necesitar cambiarlo.",
"Dejar por un instante lo que todavía no sucede.",
"Escuchar el silencio entre un pensamiento y otro.",
"Reconocer este instante como suficiente.",
"Mirar alrededor y encontrar algo que antes no estaba viendo.",
"Permitir que el presente ocupe todo el espacio.",
"Respirar sin apresurar el siguiente momento.",
"Sentir dónde estoy antes de decidir hacia dónde ir.",
"Quedarme aquí un poco más."

];


const reflexionesEN = [

"Return to the moment that is happening.",
"Observe what is here without needing to change it.",
"Let go, for a moment, of what has not happened yet.",
"Listen to the silence between one thought and the next.",
"Allow this moment to be enough.",
"Look around and notice something you had overlooked.",
"Let the present take up all the space.",
"Breathe without rushing toward the next moment.",
"Feel where you are before deciding where to go.",
"Stay here a little longer."

];


/* =========================================================
   VARIABLES
========================================================= */

let idiomaActual = null;
let ultimaReflexion = -1;


/* =========================================================
   SELECCIONAR IDIOMA
========================================================= */

function seleccionarIdioma(idioma) {

    idiomaActual = idioma;

    localStorage.setItem(
        "vishwaIdioma",
        idioma
    );

    document.getElementById(
        "selectorIdioma"
    ).style.display = "none";

    document.getElementById(
        "experiencia"
    ).style.display = "block";


    /*
    Primera entrada de la sesión:
    mostrar ritual.
    */

    iniciarRitual();

}


/* =========================================================
   RITUAL DE ENTRADA
   SOLO SE EJECUTA AL COMENZAR UNA SESIÓN
========================================================= */

function iniciarRitual() {

    const instrucciones =
        document.getElementById("instrucciones");

    const reflexion =
        document.getElementById("reflexion");

    const boton =
        document.getElementById("botonNuevo");


    /* Limpiar estado anterior */

    instrucciones.innerHTML = "";

    instrucciones.style.opacity = "1";

    reflexion.classList.remove("visible");

    reflexion.style.display = "none";

    boton.style.display = "none";


    /*
    Textos según idioma
    */

    const palabrasES = [
        "Respira.",
        "Exhala.",
        "Lee.",
        "Escribe."
    ];

    const palabrasEN = [
        "Breathe.",
        "Exhale.",
        "Read.",
        "Write."
    ];


    const palabras =
        idiomaActual === "en"
        ? palabrasEN
        : palabrasES;


    /*
    Crear las cuatro palabras
    */

    palabras.forEach((palabra, index) => {

        const elemento =
            document.createElement("div");

        elemento.className = "palabra";

        elemento.textContent = palabra;

        instrucciones.appendChild(elemento);


        let retraso;


        /*
        Respira:
        inmediatamente.

        Exhala:
        4 segundos después.

        Lee:
        1 segundo después.

        Escribe:
        1 segundo después.
        */

        if (index === 0) {

            retraso = 0;

        } else if (index === 1) {

            retraso = 4000;

        } else if (index === 2) {

            retraso = 5000;

        } else {

            retraso = 6000;

        }


        setTimeout(() => {

            elemento.classList.add("visible");

        }, retraso);

    });


    /*
    Después de Escribe:

    1 segundo de pausa.

    Luego desaparecen
    las instrucciones.
    */

    setTimeout(() => {

        instrucciones.style.opacity = "0";

    }, 7000);


    /*
    Después de desaparecer
    mostramos la primera reflexión.
    */

    setTimeout(() => {

        instrucciones.innerHTML = "";

        instrucciones.style.opacity = "1";

        mostrarReflexion();

    }, 8000);

}


/* =========================================================
   MOSTRAR REFLEXIÓN
========================================================= */

function mostrarReflexion() {

    const reflexiones =
        idiomaActual === "en"
        ? reflexionesEN
        : reflexionesES;


    let indice;


    /*
    Evitar repetir inmediatamente
    la misma reflexión.
    */

    do {

        indice =
            Math.floor(
                Math.random() *
                reflexiones.length
            );

    } while (
        indice === ultimaReflexion &&
        reflexiones.length > 1
    );


    ultimaReflexion = indice;


    const reflexion =
        document.getElementById("reflexion");

    const boton =
        document.getElementById("botonNuevo");


    /*
    Reiniciar animación
    */

    reflexion.classList.remove("visible");

    reflexion.style.display = "none";


    void reflexion.offsetWidth;


    /*
    Insertar reflexión
    */

    reflexion.textContent =
        reflexiones[indice];

    reflexion.style.display = "block";

    reflexion.classList.add("visible");


    /*
    Botón según idioma
    */

    boton.textContent =
        idiomaActual === "en"
        ? "New Vishwa"
        : "Nuevo Vishwa";


    boton.style.display = "inline-block";

}


/* =========================================================
   NUEVO VISHWA
   NO VUELVE A MOSTRAR EL RITUAL
========================================================= */

function nuevaReflexion() {

    /*
    Simplemente mostrar otra reflexión.
    */

    mostrarReflexion();

}


/* =========================================================
   CARGAR IDIOMA GUARDADO
========================================================= */

window.onload = function() {

    const idiomaGuardado =
        localStorage.getItem("vishwaIdioma");


    if (
        idiomaGuardado === "es" ||
        idiomaGuardado === "en"
    ) {

        idiomaActual =
            idiomaGuardado;


        document.getElementById(
            "selectorIdioma"
        ).style.display = "none";


        document.getElementById(
            "experiencia"
        ).style.display = "block";


        /*
        Nueva sesión:
        vuelve a aparecer el ritual.
        */

        iniciarRitual();

    }

};

</script>

</body>
</html>
